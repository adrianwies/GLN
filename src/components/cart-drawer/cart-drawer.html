<div class="drawer-backdrop" data-cart-backdrop hidden></div>
<aside class="selection-drawer" data-cart-drawer aria-hidden="true" aria-labelledby="cart-title" style="visibility:hidden;transform:translateX(100%)">
  <div class="drawer-head">
    <div><p class="tag">Productos agregados</p><h2 id="cart-title">Tu carrito</h2></div>
    <button data-cart-close type="button" aria-label="Cerrar carrito">×</button>
  </div>
  <p class="cart-summary" data-cart-summary hidden><strong data-cart-units>0</strong> unidades en <span data-cart-products>0</span> productos</p>
  <div class="selection-list" data-cart-list></div>
  <div class="drawer-empty" data-cart-empty>
    <img src="/images/gln-icon.webp" alt="GLN" />
    <p>Tu carrito está vacío.</p>
    <span>Agrega productos desde el catálogo para consultarlos con nuestro equipo.</span>
  </div>
  <div class="cart-totals" data-cart-total hidden>
    <div><span>Subtotal</span><strong data-cart-subtotal-value>S/ 0.00</strong></div>
    <div><span>Delivery <small>Lima Metropolitana</small></span><strong data-cart-delivery-value>S/ 25.00</strong></div>
    <p data-cart-delivery-note></p>
    <div class="cart-total"><span>Total estimado</span><strong data-cart-total-value>S/ 0.00</strong></div>
  </div>
  <a class="quote-link" data-cart-action href="/catalogo/" target="_blank" rel="noopener">Finalizar por WhatsApp <span>↗</span></a>
</aside>
